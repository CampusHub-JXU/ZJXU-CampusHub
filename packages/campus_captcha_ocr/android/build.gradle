group = "edu.zjxu.campus_captcha_ocr"
version = "0.1.0"

buildscript {
    repositories {
        // Aliyun mirrors for China — FIRST so google()/mavenCentral() are only
        // fallbacks; skipped in CI (set CI=true in workflow).
        if (System.getenv("CI") != "true") {
            maven { url "https://maven.aliyun.com/repository/google" }
            maven { url "https://maven.aliyun.com/repository/public" }
        }
        google()
        mavenCentral()
    }

    dependencies {
        // Keep in lockstep with android/settings.gradle.kts baseline
        // (AGP 9.1.0 / Kotlin 2.4.0) to avoid pulling a newer toolchain.
        classpath "com.android.tools.build:gradle:9.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0"
    }
}

// AGP 9: the Kotlin Gradle plugin is applied by the host app's Flutter Gradle
// plugin (android.builtInKotlin=false), not here.
apply plugin: "com.android.library"

android {
    namespace = "edu.zjxu.campus_captcha_ocr"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        // Ship the ONNX Runtime keep rules to every consumer app; R8 is enabled
        // by the Flutter Gradle plugin for release builds and would otherwise
        // strip classes that ORT's JNI resolves by literal name.
        consumerProguardFiles "consumer-rules.pro"
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Sole on-device captcha engine: ddddocr common_old (alnum-pruned, ORT format,
    // bundled asset) run by a self-built *minimal* ONNX Runtime 1.30.0 CPU build
    // (only the operators/types that model needs; arm64-v8a, armeabi-v7a, x86_64).
    // Rebuild with tools/ocr_slim/build_ort_minimal_aar.sh; provenance and flags in
    // ../THIRD_PARTY_NOTICES.md. The Java API is still the upstream ai.onnxruntime
    // package, so consumer-rules.pro keeps applying unchanged. Replaces (does not
    // stack with) the official full onnxruntime-android AAR from Maven Central.
    implementation files("libs/onnxruntime-android-minimal-1.30.0.aar")

    testImplementation "junit:junit:4.13.2"
}
