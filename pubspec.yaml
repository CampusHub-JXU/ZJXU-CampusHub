name: jxu_campus_hub
description: "嘉兴大学-智能中台 App"
publish_to: 'none'
version: 0.3.5+6

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  go_router: ^14.0.0
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  html: ^0.15.6
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0
  internet_connection_checker_plus: ^2.5.0
  package_info_plus: ^8.0.0
  file_picker: ^10.1.9
  flutter_svg: ^2.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5
  charset: ^2.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  workmanager: ^0.9.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  image_picker: ^1.1.2
  palette_generator: ^0.3.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
  shaders:
    - shaders/home_glass_background.frag
    - shaders/home_ribbon_background.frag
    - shaders/home_collage_background.frag
