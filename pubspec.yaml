name: jxu_campus_hub
description: "嘉兴大学校园应用"
publish_to: 'none'
version: 0.12.4+60

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.0
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  html: ^0.15.6
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.0.0
  file_picker: ^10.1.9
  # 系统分享（Android Sharesheet）；仅在用户点「分享」时调用，固定精确版本。
  share_plus: 12.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5
  charset: ^2.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  workmanager: ^0.9.0
  image_picker: ^1.1.2
  material_color_utilities: ^0.13.0
  # 本地 Android OCR 插件（验证码识别），仅 path 依赖。
  campus_widget_store:
    path: packages/campus_widget_store
  campus_captcha_ocr:
    path: packages/campus_captcha_ocr
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  jni: ^1.1.2
  jni_flutter: ^1.0.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  vm_service: 15.3.0
  flutter_secure_storage_platform_interface: ^1.1.2
  jnigen: ^1.0.1

# 应用图标生成：母版与自适应前景由 tools/brand/make_icons.py 产出，
# 修改设计后先跑该脚本，再执行 `dart run flutter_launcher_icons`。
flutter_launcher_icons:
  image_path: "tools/brand/app_icon_master.png"
  android: true
  adaptive_icon_background: "#CFDADF"
  adaptive_icon_foreground: "tools/brand/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "tools/brand/app_icon_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/shuatipwa/
    - assets/shuatipwa/assets/
    - assets/fonts/inter/LICENSE.txt
    # 亚克力稀疏闪粉贴图（Issue #47，tools/materials/generate_frost_grain.py 生成）。
    - assets/textures/
  # Inter 4.1（SIL OFL 1.1）拉丁 + 数字子集，中文仍跟随系统字体；
  # 子集范围与重新生成方式见 assets/fonts/inter/README.md。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
  shaders:
    - shaders/home_collage_background.frag
    - shaders/liquid_glass.frag
