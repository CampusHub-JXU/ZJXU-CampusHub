name: jxu_campus_hub
description: "嘉兴大学-智能中台 App"
publish_to: 'none'
version: 0.6.9+24

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.0
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_secure_storage: ^9.2.2
  pointycastle: ^3.9.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  html: ^0.15.6
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.0.0
  file_picker: ^10.1.9
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5
  charset: ^2.0.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  workmanager: ^0.9.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  image_picker: ^1.1.2
  palette_generator: ^0.3.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 应用图标生成：母版与自适应前景由 tools/brand/make_icons.py 产出，
# 修改设计后先跑该脚本，再执行 `dart run flutter_launcher_icons`。
flutter_launcher_icons:
  image_path: "tools/brand/app_icon_master.png"
  android: true
  adaptive_icon_background: "#8B1A2D"
  adaptive_icon_foreground: "tools/brand/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/shuatipwa/
    - assets/shuatipwa/assets/
  shaders:
    - shaders/home_glass_background.frag
    - shaders/home_ribbon_background.frag
    - shaders/home_collage_background.frag
