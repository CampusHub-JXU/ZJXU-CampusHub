<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>JXU-CampusHub Icon Concept 02 — Acrylic Glass Sail</title>
  <desc>Inspired by DESIGN.md v2 (Apple Glass Shell x Fluid Collage Shader): deep wine-crimson fluid mesh with layered frosted acrylic glass sails, 0.5dp specular rims, and FloatingDock hull.</desc>
  <defs>
    <!-- Deep fluid crimson base echoing shaders/home_collage_background.frag -->
    <linearGradient id="c02-fluidBg" x1="0.1" y1="1.0" x2="0.9" y2="0.0">
      <stop offset="0%" stop-color="#4F0916"/>
      <stop offset="48%" stop-color="#8B1A2D"/>
      <stop offset="100%" stop-color="#B32B44"/>
    </linearGradient>
    <radialGradient id="c02-fluidOrb1" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0%" stop-color="#EB7A90" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#C4546A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B1A2D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c02-fluidOrb2" cx="0.16" cy="0.86" r="0.65">
      <stop offset="0%" stop-color="#3B0510" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4F0916" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary frosted acrylic sail fill (milk-white mist) -->
    <linearGradient id="c02-glassMist" x1="0.2" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#F6E7EA" stop-opacity="0.16"/>
    </linearGradient>
    <!-- Specular rim gradient -->
    <linearGradient id="c02-glassRim" x1="0.0" y1="0.0" x2="1.0" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Primary porcelain sail gradient -->
    <linearGradient id="c02-primarySail" x1="0.25" y1="0.0" x2="0.75" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FDF9FA"/>
      <stop offset="100%" stop-color="#F6E7EA"/>
    </linearGradient>

    <!-- Floating Dock glass capsule fill -->
    <linearGradient id="c02-dockGlass" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>

    <!-- Soft ambient elevation shadow (never neon glow) -->
    <filter id="c02-softShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#38040E" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <g id="bg-layer">
    <rect x="0" y="0" width="100%" height="100%" fill="url(#c02-fluidBg)"/>
    <rect x="0" y="0" width="100%" height="100%" fill="url(#c02-fluidOrb1)"/>
    <rect x="0" y="0" width="100%" height="100%" fill="url(#c02-fluidOrb2)"/>
  </g>

  <!-- Foreground Layer -->
  <g id="fg-layer">
    <!-- Back Acrylic Sail / Turned Page (frosted glass + specular rim) -->
    <path
      d="M 326 276
         C 328 267, 338 263, 348 266
         C 412 284, 478 304, 538 322
         C 548 325, 555 334, 556 345
         C 568 466, 520 590, 348 622
         C 337 624, 330 614, 338 606
         C 424 532, 422 414, 348 308
         C 339 295, 331 285, 326 276 Z"
      fill="url(#c02-glassMist)"
      stroke="url(#c02-glassRim)"
      stroke-width="4"
    />

    <!-- Primary Luminous Sail -->
    <path
      filter="url(#c02-softShadow)"
      d="M 434 206
         C 436 197, 447 194, 458 197
         C 536 220, 616 242, 692 258
         C 704 261, 712 271, 713 284
         C 728 438, 668 598, 444 628
         C 432 630, 425 619, 434 610
         C 552 524, 550 380, 462 246
         C 451 230, 441 217, 434 206 Z"
      fill="url(#c02-primarySail)"
    />

    <!-- Translucent FloatingDock Base Capsule (22dp squircle parity) -->
    <rect
      x="248"
      y="678"
      width="528"
      height="116"
      rx="58"
      fill="url(#c02-dockGlass)"
      stroke="url(#c02-glassRim)"
      stroke-width="4"
    />

    <!-- Crisp Open-Book V-Wave Anchor inside the Glass Dock -->
    <path
      d="M 312 722
         H 434
         C 464 722, 490 732, 512 748
         C 534 732, 560 722, 590 722
         H 712"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
