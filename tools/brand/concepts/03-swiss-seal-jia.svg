<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>JXU-CampusHub Icon Concept 03 — Architectural Seal "嘉"</title>
  <desc>Pure-vector architectural upgrade of the current "嘉" launcher icon: eliminates Windows font dependency, guarantees >=30px inter-stroke clearance for 48dp legibility, framed by an open-book seal border.</desc>
  <defs>
    <linearGradient id="c03-sealBg" x1="0.2" y1="1.0" x2="0.8" y2="0.0">
      <stop offset="0%" stop-color="#701122"/>
      <stop offset="60%" stop-color="#8B1A2D"/>
      <stop offset="100%" stop-color="#9A2035"/>
    </linearGradient>
    <radialGradient id="c03-sealGlow" cx="0.78" cy="-0.12" r="0.90">
      <stop offset="0%" stop-color="#D4667B" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#C4546A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B1A2D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <g id="bg-layer">
    <rect x="0" y="0" width="100%" height="100%" fill="url(#c03-sealBg)"/>
    <rect x="0" y="0" width="100%" height="100%" fill="url(#c03-sealGlow)"/>
  </g>

  <!-- Foreground Layer -->
  <g id="fg-layer">
    <!-- Subtle Modern University Seal Inner Rim with Open-Book Bottom Notch -->
    <path
      d="M 442 842
         H 326
         C 246 842, 182 778, 182 698
         V 326
         C 182 246, 246 182, 326 182
         H 698
         C 778 182, 842 246, 842 326
         V 698
         C 842 778, 778 842, 698 842
         H 582"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.22"
      stroke-width="12"
      stroke-linecap="round"
    />
    <!-- Open-Book V Accent at Bottom of Seal -->
    <path
      d="M 466 832 L 512 858 L 558 832"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.72"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bespoke Pure-Vector Geometric Monogram 「嘉」 (14 strokes, zero font dependency) -->
    <g
      fill="none"
      stroke="#FFFFFF"
      stroke-width="34"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- 1-3. Top 「士」 -->
      <line x1="322" y1="274" x2="702" y2="274"/>
      <line x1="512" y1="226" x2="512" y2="338"/>
      <line x1="368" y1="338" x2="656" y2="338"/>

      <!-- 4-6. Upper-Middle 「口」 -->
      <rect x="374" y="398" width="276" height="78" rx="16"/>

      <!-- 7-8. Middle 「丷」 ticks -->
      <line x1="428" y1="510" x2="446" y2="544" stroke-width="30"/>
      <line x1="596" y1="510" x2="578" y2="544" stroke-width="30"/>

      <!-- 9. Main Horizontal Beam 「一」 -->
      <line x1="276" y1="572" x2="748" y2="572"/>

      <!-- 10-11. Bottom-Left 「力」 -->
      <path d="M 300 648 H 484 C 484 704, 478 746, 464 766 C 454 780, 434 780, 406 770"/>
      <path d="M 392 602 C 388 674, 354 736, 282 778"/>

      <!-- 12-14. Bottom-Right 「口」 -->
      <rect x="550" y="642" width="174" height="130" rx="18"/>
    </g>
  </g>
</svg>
