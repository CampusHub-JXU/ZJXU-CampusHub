# CampusHub 反馈收集 Worker
# 纯 ES Module JavaScript，无运行时依赖，
# 直接 `cf dev` 本地联调或 `cf deploy` 部署。

name = "jxuc-feedback-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 使用平台提供的 workers.dev 地址，无需域名或 DNS 权限。
workers_dev = true

[vars]
GITHUB_OWNER = "CampusHub-JXU"
GITHUB_REPO = "ZJXU-CampusHub"
# 维护者配置 GITHUB_TOKEN 并验收后，改为 false 再部署。
PAUSE_SUBMISSIONS = "true"

# ── 密钥（不写入本文件，通过 cf workers secrets update 注入）────────
#   在 Cloudflare Dashboard → Settings → Variables and Secrets 配置 GITHUB_TOKEN
#     GitHub Fine-grained PAT，仅授权 CampusHub-JXU/ZJXU-CampusHub，
#     权限只需 Issues: Read and write。
#
# 可选 Secret：FEEDBACK_CLIENT_KEY
#   设置后，客户端除 X-App-Client 头外还需携带匹配的 X-Client-Key；
#   未设置时仅校验 X-App-Client: jxu-campushub。
