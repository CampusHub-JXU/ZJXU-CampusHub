name: Release To Public GitHub And Gitee

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 指定要发布的 tag，留空时使用当前 ref
        required: false
        type: string
      dry_run:
        description: 仅构建并校验流程，不向 public/Gitee 发布
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INPUT_TAG: ${{ github.event.inputs.tag || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      PUBLIC_GH_OWNER: FHfanshu
      PUBLIC_GH_REPO: JXU-Portal
      GITEE_OWNER: fhfanshu
      GITEE_REPO: JXU-Portal
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_REPO_TOKEN}" ]; then
            echo "Missing required secret: PUBLIC_REPO_TOKEN" >&2
            exit 1
          fi
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "Missing required secret: GITEE_TOKEN" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${INPUT_TAG}"
          if [ -z "${release_tag}" ]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "${release_tag}" ]; then
            echo "Unable to resolve release tag" >&2
            exit 1
          fi

          release_name="嘉兴大学-校园门户 ${release_tag}"
          apk_name="JXU-Portal-${release_tag}.apk"
          apk_path="build/app/outputs/flutter-apk/${apk_name}"
          cp build/app/outputs/flutter-apk/app-release.apk "${apk_path}"

          previous_tag="$(git tag --sort=-creatordate | grep -Fxv "${release_tag}" | head -n 1 || true)"
          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..${release_tag}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${release_tag}"
          else
            range="${release_tag}"
            compare_url=""
          fi

          changelog="$(git log --no-merges --pretty='- %s (`%h`)' "${range}" || true)"
          if [ -z "${changelog}" ]; then
            changelog='- 本版本暂无可归档的提交记录'
          fi

          {
            echo "## 中文更新日志"
            echo
            echo "- 版本：\`${release_tag}\`"
            if [ -n "${previous_tag}" ]; then
              echo "- 对比版本：\`${previous_tag} -> ${release_tag}\`"
              echo "- 变更对比：${compare_url}"
            fi
            echo "- 发布时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')"
            echo
            echo "### 提交记录"
            echo "${changelog}"
            echo
            echo "### 安装说明"
            echo "- 下载下方 APK 后可直接安装"
            echo "- GitHub 公开仓 Release 与 Gitee Release 使用同一份 dev 构建产物"
            echo "- 如遇覆盖安装提示，请确认安装包来源与签名一致"
          } > RELEASE_BODY.md

          {
            echo "RELEASE_TAG=${release_tag}"
            echo "RELEASE_NAME=${release_name}"
            echo "APK_NAME=${apk_name}"
            echo "APK_PATH=${apk_path}"
          } >> "${GITHUB_ENV}"

      - name: Resolve public release target branch
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail

          public_repo="${PUBLIC_GH_OWNER}/${PUBLIC_GH_REPO}"
          public_target_commitish="$(gh repo view "${public_repo}" --json defaultBranchRef -q '.defaultBranchRef.name')"

          if [ -z "${public_target_commitish}" ]; then
            echo "Failed to resolve default branch for ${public_repo}" >&2
            exit 1
          fi

          echo "PUBLIC_TARGET_COMMITISH=${public_target_commitish}" >> "${GITHUB_ENV}"

      - name: Ensure tag exists in public repository
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail

          public_repo="${PUBLIC_GH_OWNER}/${PUBLIC_GH_REPO}"
          target_ref="heads/${PUBLIC_TARGET_COMMITISH}"
          target_sha="$(gh api "repos/${public_repo}/git/ref/${target_ref}" -q '.object.sha')"

          if [ -z "${target_sha}" ]; then
            echo "Failed to resolve ${target_ref} in ${public_repo}" >&2
            exit 1
          fi

          if gh api "repos/${public_repo}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists in ${public_repo}"
          else
            gh api -X POST "repos/${public_repo}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${target_sha}" >/dev/null
            echo "Created tag ${RELEASE_TAG} at ${target_sha} in ${public_repo}"
          fi

      - name: Publish GitHub release to public repository
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail

          public_repo="${PUBLIC_GH_OWNER}/${PUBLIC_GH_REPO}"
          if gh release view "${RELEASE_TAG}" --repo "${public_repo}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --repo "${public_repo}" \
              --title "${RELEASE_NAME}" \
              --notes-file RELEASE_BODY.md
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${public_repo}" \
              --title "${RELEASE_NAME}" \
              --notes-file RELEASE_BODY.md
          fi

          gh release upload "${RELEASE_TAG}" \
            "${APK_PATH}#${APK_NAME}" \
            --repo "${public_repo}" \
            --clobber

          {
            echo "PUBLIC_RELEASE_URL=https://github.com/${public_repo}/releases/tag/${RELEASE_TAG}"
            echo "PUBLIC_APK_URL=https://github.com/${public_repo}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Upsert Gitee release with same APK
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail

          gitee_release_api="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases"
          release_body="$(cat RELEASE_BODY.md)"
          tag_query_url="${gitee_release_api}/tags/${RELEASE_TAG}?access_token=${GITEE_TOKEN}"

          echo "Querying Gitee release for tag ${RELEASE_TAG}"
          release_status="$(curl --silent --show-error -o gitee_release.json -w '%{http_code}' "${tag_query_url}")"
          release_id=""
          gitee_download_url=""
          if [ "${release_status}" = "200" ]; then
            release_id="$(jq -r 'if type == "object" then (.id // "") else "" end' gitee_release.json)"
            gitee_download_url="$(jq -r --arg name "${APK_NAME}" 'if type == "object" then ([.assets[]? | select(.name == $name) | .browser_download_url] | first // "") else "" end' gitee_release.json)"
          fi

          if [ -n "${release_id}" ]; then
            echo "Reusing existing Gitee release ${release_id}"
          elif [ "${release_status}" = "200" ] || [ "${release_status}" = "404" ]; then
            echo "Creating Gitee release for ${RELEASE_TAG}"
            curl --silent --show-error --fail-with-body \
              -X POST "${gitee_release_api}" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "tag_name=${RELEASE_TAG}" \
              -F "name=${RELEASE_NAME}" \
              --form-string "body=${release_body}" \
              -F "prerelease=false" \
              -F "target_commitish=${PUBLIC_TARGET_COMMITISH}" \
              -o gitee_release.json
          else
            cat gitee_release.json
            echo "Failed to query Gitee release, status: ${release_status}" >&2
            exit 1
          fi

          release_id="$(jq -r 'if type == "object" then (.id // "") else "" end' gitee_release.json)"
          if [ -z "${release_id}" ]; then
            cat gitee_release.json
            echo "Failed to resolve Gitee release id" >&2
            exit 1
          fi

          if [ -z "${gitee_download_url}" ]; then
            gitee_download_url="$(jq -r --arg name "${APK_NAME}" 'if type == "object" then ([.assets[]? | select(.name == $name) | .browser_download_url] | first // "") else "" end' gitee_release.json)"
          fi

          if [ -n "${gitee_download_url}" ]; then
            echo "Gitee release already has asset ${APK_NAME}, skip re-upload"
          else
            echo "Uploading ${APK_NAME} to Gitee release ${release_id}"
            curl --progress-bar --show-error --fail-with-body \
              -H "Expect:" \
              --connect-timeout 30 \
              --max-time 1800 \
              --retry 2 \
              --retry-all-errors \
              -X POST "${gitee_release_api}/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${APK_PATH}" \
              -o gitee_attach.json
            echo "Upload request finished"

            gitee_download_url="$(jq -r '.browser_download_url // empty' gitee_attach.json)"
            if [ -z "${gitee_download_url}" ]; then
              cat gitee_attach.json
              echo "Failed to upload APK to Gitee release" >&2
              exit 1
            fi
          fi

          echo "GITEE_APK_URL=${gitee_download_url}" >> "${GITHUB_ENV}"

      - name: Summarize release distribution
        shell: bash
        run: |
          {
            echo "## Release Distributed"
            echo
            echo "- Tag: ${RELEASE_TAG}"
            echo "- Dry run: ${DRY_RUN}"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "- Public GitHub release: skipped"
              echo "- Public GitHub APK: skipped"
              echo "- Gitee APK: skipped"
            else
              echo "- Public GitHub release: ${PUBLIC_RELEASE_URL}"
              echo "- Public GitHub APK: ${PUBLIC_APK_URL}"
              echo "- Gitee APK: ${GITEE_APK_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
