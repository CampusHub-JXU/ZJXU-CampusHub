name: CI Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_apk_build:
        description: Run optional Android APK build smoke test
        required: false
        default: false
        type: boolean
      shuati_pwa_ref:
        description: Shuati PWA ref for optional APK build smoke test
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  flutter-test:
    name: Flutter Analyze And Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHUATI_PWA_REPO_TOKEN: ${{ secrets.SHUATI_PWA_REPO_TOKEN }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print tool versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze project source
        run: flutter analyze

      - name: Run test diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_diagnostics.py --self-test
          python tools/test_diagnostics.py --output build/test_diagnostics --fail-on error

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/core/update/update_service_test.dart

      - name: Run full test suite
        # Several suites exercise process-wide auth/network singletons and
        # filesystem-backed cookie jars. Keep the release gate deterministic.
        run: flutter test --coverage --concurrency=1

      - name: Summarize test diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f build/test_diagnostics/test_diagnostics.md ]; then
            cat build/test_diagnostics/test_diagnostics.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload test diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: build/test_diagnostics/
          if-no-files-found: ignore

      - name: Checkout Shuati PWA source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true && env.SHUATI_PWA_REPO_TOKEN == '' }}
        uses: actions/checkout@v5
        with:
          repository: FHfanshu/shuatipwa
          path: shuatipwa
          ref: ${{ inputs.shuati_pwa_ref || 'main' }}

      - name: Checkout Shuati PWA source with token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true && env.SHUATI_PWA_REPO_TOKEN != '' }}
        uses: actions/checkout@v5
        with:
          repository: FHfanshu/shuatipwa
          path: shuatipwa
          ref: ${{ inputs.shuati_pwa_ref || 'main' }}
          token: ${{ env.SHUATI_PWA_REPO_TOKEN }}

      - name: Set up Node.js for Shuati PWA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shuatipwa/package-lock.json

      - name: Build and sync Shuati PWA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        shell: pwsh
        run: ./tools/sync_shuati_pwa.ps1 -SourcePath ./shuatipwa -Install

      - name: Optional Android APK build smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        run: flutter build apk --debug

  workflow-smoke:
    name: Workflow Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5

      - name: Parse workflow YAML files
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path); puts "parsed #{path}" }'

      - name: Validate release workflow target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_release_workflow.py

      - name: Summarize workflow smoke test
        shell: bash
        run: |
          {
            echo "## Workflow Smoke Test"
            echo
            echo "- CI workflow parsed successfully"
            echo "- Release workflow targets FHfanshu/ZJXU-CampusHub main"
            echo "- Release identity and production signing guards are present"
            echo "- Gitee publishing references are absent"
          } >> "${GITHUB_STEP_SUMMARY}"
