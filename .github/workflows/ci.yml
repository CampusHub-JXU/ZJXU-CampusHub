name: CI Test

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_apk_build:
        description: Run optional Android APK build smoke test
        required: false
        default: false
        type: boolean
      with_coverage:
        description: Collect test coverage (slower; off for push / PR)
        required: false
        default: false
        type: boolean
      shuati_pwa_ref:
        description: Shuati PWA ref for optional APK build smoke test
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  checks:
    name: Format, Analyze And Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run_update_native: ${{ steps.changed.outputs.run_update_native }}
    env:
      SHUATI_PWA_REPO_TOKEN: ${{ secrets.SHUATI_PWA_REPO_TOKEN }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect update-native changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_update_native=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base_ref=""
          if [ "${{ github.event_name }}" = "pull_request" ] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            base_ref="HEAD^1"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base_ref="${{ github.event.before }}"
          fi
          if [ -z "${base_ref}" ]; then
            echo "run_update_native=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${base_ref}" HEAD | grep -Eq '^(android/app/src/main/kotlin/edu/zjxu/jxucampushub/platform/update/|tools/update_native_tests/|\.github/workflows/ci\.yml$)'; then
            echo "run_update_native=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run_update_native=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Print tool versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Parse workflow YAML files
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path); puts "parsed #{path}" }'

      - name: Validate release workflow target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_release_workflow.py

      - name: Analyze project source
        run: flutter analyze

      - name: Run test diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_diagnostics.py --self-test
          python tools/test_diagnostics.py --output build/test_diagnostics --fail-on error

      - name: Summarize test diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f build/test_diagnostics/test_diagnostics.md ]; then
            cat build/test_diagnostics/test_diagnostics.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload test diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: build/test_diagnostics/
          if-no-files-found: ignore

      - name: Checkout Shuati PWA source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true && env.SHUATI_PWA_REPO_TOKEN == '' }}
        uses: actions/checkout@v5
        with:
          repository: FHfanshu/shuatipwa
          path: shuatipwa
          ref: ${{ inputs.shuati_pwa_ref || 'main' }}

      - name: Checkout Shuati PWA source with token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true && env.SHUATI_PWA_REPO_TOKEN != '' }}
        uses: actions/checkout@v5
        with:
          repository: FHfanshu/shuatipwa
          path: shuatipwa
          ref: ${{ inputs.shuati_pwa_ref || 'main' }}
          token: ${{ env.SHUATI_PWA_REPO_TOKEN }}

      - name: Set up Node.js for Shuati PWA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: shuatipwa/package-lock.json

      - name: Build and sync Shuati PWA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        shell: pwsh
        run: ./tools/sync_shuati_pwa.ps1 -SourcePath ./shuatipwa -Install

      - name: Optional Android APK build smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        run: flutter build apk --debug

      - name: Optional check that the minimal ONNX Runtime is packaged
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_apk_build == true }}
        shell: bash
        run: |
          set -euo pipefail
          # The captcha OCR plugin consumes a local minimal ORT AAR
          # (packages/campus_captcha_ocr/android/maven-repo/); make sure AGP merged its
          # native libs and the ORT-format model into the app for every ABI.
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          listing="$(unzip -l "${apk}")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libonnxruntime.so libonnxruntime4j_jni.so; do
              grep -q " lib/${abi}/${lib}$" <<<"${listing}" || { echo "Missing lib/${abi}/${lib} in ${apk}" >&2; exit 1; }
            done
          done
          grep -q " assets/captcha_ocr/common_old_alnum.ort$" <<<"${listing}" || { echo "Missing .ort captcha model in ${apk}" >&2; exit 1; }
          grep -E " lib/[^/]+/libonnxruntime.*\.so$| assets/captcha_ocr/" <<<"${listing}"

  test:
    name: Flutter Test (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run test shard
        # Shard by file rather than with `--total-shards`: test's own sharding
        # splits individual tests, so every shard would still compile every
        # file (about half of the suite's cost). Each test file runs in its own
        # process (singletons are per-process); test/flutter_test_config.dart
        # gives every process its own temp dir, so default concurrency is safe.
        # Coverage adds ~75% and is only collected on manual dispatch.
        shell: bash
        env:
          WITH_COVERAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.with_coverage == true }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find test -name '*_test.dart' | LC_ALL=C sort | awk -v n=2 -v i=${{ matrix.shard }} '(NR - 1) % n == i - 1')
          echo "Shard ${{ matrix.shard }}/2: ${#files[@]} test files"
          if [ "${WITH_COVERAGE}" = "true" ]; then
            flutter test --coverage "${files[@]}"
          else
            flutter test "${files[@]}"
          fi

      - name: Upload coverage artifact
        if: always() && github.event_name == 'workflow_dispatch' && inputs.with_coverage == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: ignore

  # Aggregate status under the historical job name so branch protection that
  # requires "Flutter Analyze And Test" keeps covering analyze and every shard.
  flutter-test:
    name: Flutter Analyze And Test
    if: always()
    needs: [checks, test, update-native-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "checks: ${{ needs.checks.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "update-native-tests: ${{ needs.update-native-tests.result }}"
          [ "${{ needs.checks.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && { [ "${{ needs.update-native-tests.result }}" = "success" ] || [ "${{ needs.update-native-tests.result }}" = "skipped" ]; }

  # Production update-lifecycle Kotlin (state machine / store / manager) compiled
  # and run on the JVM against Android stubs; no Android SDK, emulator or Flutter.
  # run.py never downloads, so a throwaway Gradle project first fills the Gradle
  # module cache with the Kotlin compiler jars it needs (the Kotlin version is
  # read from android/settings.gradle.kts, no second pin).
  update-native-tests:
    name: Update Native Host Tests
    needs: [checks]
    if: ${{ needs.checks.outputs.run_update_native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Kotlin compiler jars
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: update-native-tests-${{ runner.os }}-${{ hashFiles('android/settings.gradle.kts', 'tools/update_native_tests/ci/build.gradle.kts') }}

      - name: Resolve Kotlin compiler jars into the Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          # The runner image ships Gradle; fall back to a pinned download if not.
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL -o "${RUNNER_TEMP}/gradle.zip" https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
            unzip -q "${RUNNER_TEMP}/gradle.zip" -d "${RUNNER_TEMP}"
            export PATH="${RUNNER_TEMP}/gradle-9.3.1/bin:${PATH}"
          fi
          gradle --version
          for attempt in 1 2 3; do
            if gradle -p tools/update_native_tests/ci --no-daemon --console=plain -q resolveUpdateNativeTestDeps; then
              exit 0
            fi
            echo "Resolve attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          echo "Could not resolve the Kotlin compiler jars" >&2
          exit 1

      - name: Run update native host tests
        shell: bash
        run: python3 tools/update_native_tests/run.py
