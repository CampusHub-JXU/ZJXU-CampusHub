org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental caches break when plugin sources (pub cache, C:) and the
# build dir (D:) sit on different Windows drive roots ("this and base files
# have different roots"); with KGP 2.4 that is a hard build failure.
kotlin.incremental=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Do not force a local proxy at repository level. Developer-specific proxy
# should be configured in user-level ~/.gradle/gradle.properties when needed.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 rejects getDefaultProguardFile("proguard-android.txt"); flutter_inappwebview_android
# 1.1.3 (latest stable) still uses it. Temporary opt-out — drop once the plugin ships a fix.
android.r8.proguardAndroidTxt.disallowed=false
