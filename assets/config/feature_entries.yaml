# 功能入口配置说明：
# - id: 唯一标识，尽量保持稳定
# - route: 对应 lib/app/routes.dart 中已注册的 route name
# - placements: 控制入口出现在哪些区域
#   - service_hub: 功能页交错网格
#   - home_learning: 首页「学习服务」轻量列表
# - span.compact: 手机 2 列布局下的尺寸
# - span.expanded: 宽屏 4 列布局下的尺寸
#
# 支持的尺寸组合：
# - 1x1: small_square
# - 1x2: tall_rect
# - 2x1: wide_rect
# - 2x2: large_square
#
# 调整建议：
# - 想让手机端更紧凑，优先改 span.compact
# - 想让平板/横屏更有层次，优先改 span.expanded
# - 如果某张卡在首页也会显示，通常只需要保证标题和副标题足够短
entries:
  - id: service-hall
    title: 服务大厅
    subtitle: 统一入口，继续保留主页快捷访问
    icon: dashboard_customize_outlined
    color: primary
    route: service-hall
    span:
      # compact: 手机 2 列布局，当前配置为整行横向卡片
      compact:
        columns: 1
        rows: 2
      # expanded: 宽屏 4 列布局，当前配置为 2x2 主视觉卡片
      expanded:
        columns: 1
        rows: 2
    placements:
      - service_hub
    sort: 10

  - id: second-classroom
    title: 第二课堂
    subtitle: 学分活动、个人中心与微信版页面
    icon: workspace_premium_outlined
    color: gold
    route: second-classroom
    span:
      compact:
        columns: 1
        rows: 1
      expanded:
        columns: 1
        rows: 1
    placements:
      - service_hub
      - home_learning
    sort: 20

  - id: library
    title: 图书馆
    subtitle: 馆藏检索、借阅与电子资源入口
    icon: local_library_outlined
    color: info
    route: library
    span:
      compact:
        columns: 1
        rows: 1
      expanded:
        columns: 1
        rows: 1
    placements:
      - service_hub
      - home_learning
    sort: 30

  - id: changxing-jiada
    title: 畅行嘉大
    subtitle: 请假、返校、离校与加班申请
    icon: north_rounded
    color: "#2EA567"
    route: changxing-jiada
    span:
      compact:
        columns: 1
        rows: 1
      expanded:
        columns: 1
        rows: 1
    placements:
      - service_hub
      - home_learning
    sort: 40

  - id: sjjx-notice-list
    title: 实践通知
    subtitle: 实践教学通知与公告聚合
    icon: science_outlined
    color: "#1976D2"
    route: sjjx-notice-list
    span:
      compact:
        columns: 1
        rows: 1
      expanded:
        columns: 1
        rows: 1
    placements:
      - service_hub
      - home_learning
    sort: 50

  - id: notice-list
    title: 校园公告
    subtitle: 校级通知与重要公告快速查看
    icon: campaign_outlined
    color: "#E7A400"
    route: notice-list
    span:
      compact:
        columns: 1
        rows: 1
      expanded:
        columns: 1
        rows: 1
    placements:
      - service_hub
